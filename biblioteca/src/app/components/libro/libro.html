<div style="padding: 20px;">
  <h2>Catálogo de Biblioteca</h2>
  <button (click)="cerrarSesion()" style="float: right;">Cerrar Sesión</button>
  <p><strong>Total de registros:</strong> {{ libros.length }}</p>

 <form (ngSubmit)="guardarLibro()" style="margin-bottom: 20px; background: #f4f4f4; padding: 15px; border-radius: 5px;">
    <h3>{{ editando ? 'Editar Libro' : 'Nuevo Libro' }}</h3>
    <div>
      <label>Código (conserva ceros): </label><br>
      <input type="text" [(ngModel)]="libroForm.codigo" name="codigo" required />
    </div>
    <div style="margin-top: 8px;">
      <label>Título: </label><br>
      <input type="text" [(ngModel)]="libroForm.titulo" name="titulo" required />
    </div>
    <div style="margin-top: 8px;">
      <label>Autor: </label><br>
      <input type="text" [(ngModel)]="libroForm.autor" name="autor" required />
    </div>
    <div style="margin-top: 8px;">
      <label>Año (1000 - 9999): </label><br>
      <input type="number" [(ngModel)]="libroForm.anio" name="anio" min="1000" max="9999" required />
    </div>
    <button type="submit" style="margin-top: 12px;">{{ editando ? 'Actualizar' : 'Crear' }}</button>
    <button type="button" (click)="cancelarEdicion()" *ngIf="editando" style="margin-left: 10px;">Cancelar</button>
  </form>

  <table border="1" cellpadding="8" style="width: 100%; border-collapse: collapse;" *ngIf="libros.length > 0">
    <thead>
      <tr style="background: #e2e2e2;">
        <th>ID</th>
        <th>Código</th>
        <th>Título</th>
        <th>Autor</th>
        <th>Año</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let l of libros">
        <td>{{ l.id }}</td>
        <td>{{ l.codigo }}</td>
        <td>{{ l.titulo }}</td>
        <td>{{ l.autor }}</td>
        <td>{{ l.anio }}</td>
        <td>
          <button (click)="editarLibro(l)">Editar</button>
          <button (click)="eliminarLibro(l.id)" style="margin-left: 5px; color: red;">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="libros.length === 0" style="color: gray; font-style: italic;">No hay registros disponibles en el catálogo.</p>
</div>
