<div style="padding: 20px; max-width: 300px; margin: auto;">
  <h2>Login Tienda</h2>
  <form (ngSubmit)="login()">
    <div>
      <label>Usuario:</label><br>
      <input type="text" [(ngModel)]="usuario" name="usuario" required />
    </div>
    <div style="margin-top: 10px;">
      <label>Contraseña:</label><br>
      <input type="password" [(ngModel)]="password" name="password" required />
    </div>
    <button type="submit" style="margin-top: 15px;">Ingresar</button>
  </form>
  <p style="color: red;" *ngIf="error">{{ error }}</p>
</div>
